# Clojure Plugin Default Properties
# These properties define default values for Clojure scripting support

# Script cache size for compiled Clojure scripts
clojure_script_cache_size=100

# Script execution timeout in milliseconds
clojure_script_timeout=30000

# Enable security manager for Clojure scripts
clojure_script_security_enabled=true

# Clojure script file extensions
clojure_script_extensions=.clj,.cljs

# Default Clojure namespace for scripts
clojure_default_namespace=freeplane.clojure.user

# Enable ClojureScript support
clojure_script_enabled=false
